<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroPlaceholder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" rx="20" fill="url(#heroPlaceholder)" stroke="#6B5EFF" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Hero content mockup -->
  <rect x="50" y="50" width="500" height="60" rx="8" fill="#6B5EFF" opacity="0.1" />
  <text x="300" y="85" text-anchor="middle" fill="#6B5EFF" font-family="system-ui" font-size="24" font-weight="700">CHALK HERO IMAGE</text>
  
  <!-- Floating elements -->
  <circle cx="100" cy="150" r="20" fill="#FFD93D" opacity="0.3" />
  <circle cx="500" cy="200" r="15" fill="#FF6B9D" opacity="0.4" />
  <circle cx="450" cy="100" r="12" fill="#6B5EFF" opacity="0.5" />
  
  <!-- Bottom accent -->
  <rect x="200" y="320" width="200" height="4" rx="2" fill="#6B5EFF" opacity="0.6" />
  
  <text x="300" y="280" text-anchor="middle" fill="#737373" font-family="system-ui" font-size="14">실제 이미지로 교체 예정</text>
</svg>