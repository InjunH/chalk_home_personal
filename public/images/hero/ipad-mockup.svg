<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ipadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5EFF" />
      <stop offset="100%" stop-color="#8B7FFF" />
    </linearGradient>
  </defs>
  
  <!-- iPad Frame -->
  <rect x="20" y="20" width="360" height="260" rx="20" fill="url(#ipadGradient)" stroke="#D4D4D4" stroke-width="2" />
  
  <!-- Screen -->
  <rect x="40" y="40" width="320" height="220" rx="8" fill="url(#screenGradient)" />
  
  <!-- App Content Mockup -->
  <rect x="60" y="60" width="280" height="40" rx="4" fill="rgba(255,255,255,0.9)" />
  <text x="70" y="82" fill="#1A1A1A" font-family="system-ui" font-size="14" font-weight="600">CHALK AI Learning</text>
  
  <!-- Content Cards -->
  <rect x="60" y="120" width="130" height="80" rx="8" fill="rgba(255,255,255,0.8)" />
  <rect x="210" y="120" width="130" height="80" rx="8" fill="rgba(255,255,255,0.8)" />
  
  <!-- Progress Indicators -->
  <circle cx="80" cy="140" r="4" fill="#FFD93D" />
  <circle cx="100" cy="140" r="4" fill="#FF6B9D" />
  <circle cx="120" cy="140" r="4" fill="#6B5EFF" />
  
  <!-- Home Button -->
  <rect x="185" y="270" width="30" height="4" rx="2" fill="#A3A3A3" />
</svg>