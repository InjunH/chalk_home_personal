<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <conicGradient id="lightConic" cx="50%" cy="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="25%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="75%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)" />
    </conicGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="rotate(45 600 400)" filter="url(#glow)">
    <ellipse cx="600" cy="400" rx="400" ry="200" fill="url(#lightConic)" opacity="0.6" />
  </g>
  
  <!-- Additional light spots -->
  <circle cx="200" cy="150" r="80" fill="rgba(107,94,255,0.2)" filter="url(#glow)" />
  <circle cx="1000" cy="650" r="60" fill="rgba(255,107,157,0.15)" filter="url(#glow)" />
  <circle cx="900" cy="100" r="40" fill="rgba(255,217,61,0.2)" filter="url(#glow)" />
</svg>